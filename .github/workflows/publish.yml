name: Publish to NPM

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 0.10.5)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: corepack enable

      - name: Install dependencies
        run: pnpm i

      - name: Run tests
        run: |
          pnpm test
          pnpm test:integration

      - name: Build project
        run: pnpm build

      - name: Check if version exists
        id: check-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Check if version already exists on npm
          if npm view ts-prune@$VERSION version > /dev/null 2>&1; then
            echo "Version $VERSION already exists on npm"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Version $VERSION does not exist on npm"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Update package.json version
        if: steps.check-version.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.check-version.outputs.version }}"
          npm version $VERSION --no-git-tag-version

      - name: Publish to NPM
        if: steps.check-version.outputs.exists == 'false'
        run: pnpm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: steps.check-version.outputs.exists == 'false' && github.event_name == 'push'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ steps.check-version.outputs.version }}
          body: |
            ## What's Changed

            - Updated TypeScript to 5.5.3
            - Updated Commander to 8.3.0
            - Updated JSON5 to 2.2.3
            - Updated ts-morph to 21.0.1
            - Added performance optimizations
            - Added scope option for monorepos
            - Added parallel processing option
            - Added performance metrics

            ## New Features

            - `--scope` - Limit analysis to specific directory (useful for monorepos)
            - `--parallel` - Enable parallel processing for better performance
            - `--performance` - Show performance metrics and timing information

            ## Performance Improvements

            - Automatic caching of analysis results
            - Parallel file processing
            - Optimized project loading for scope
            - Reduced memory usage in monorepos

            Full Changelog: https://github.com/nadeesha/ts-prune/compare/${{ github.event.before }}...${{ github.sha }}
          draft: false
          prerelease: false
