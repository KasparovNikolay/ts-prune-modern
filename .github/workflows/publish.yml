name: Publish to NPM

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 0.10.5 or 1.0.0-rc.1)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.6.0"
          registry-url: "https://registry.npmjs.org"

      - run: corepack enable

      - name: Configure pnpm
        run: pnpm config set git-checks false

      - name: Configure npm authentication
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          echo "registry=https://registry.npmjs.org/" >> ~/.npmrc
          echo "always-auth=true" >> ~/.npmrc

      - name: Install dependencies
        run: pnpm i

      - name: Run tests
        run: pnpm test

      - name: Run test integeration
        run: pnpm test:integration
        continue-on-error: true

      - name: Build project
        run: pnpm build

      - name: Check if version exists
        id: check-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Check if version already exists on npm
          if npm view ts-prune@$VERSION version > /dev/null 2>&1; then
            echo "Version $VERSION already exists on npm"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Version $VERSION does not exist on npm"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Update package.json version
        if: steps.check-version.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.check-version.outputs.version }}"
          npm version $VERSION --no-git-tag-version

      - name: Verify npm authentication
        if: steps.check-version.outputs.exists == 'false'
        run: |
          echo "Checking NPM authentication..."
          echo "Token length: ${#NPM_TOKEN}"
          echo "Token starts with: ${NPM_TOKEN:0:10}..."
          npm whoami || echo "npm whoami failed, but continuing..."
          echo "NPM authentication check completed"

      - name: Publish to NPM
        if: steps.check-version.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.check-version.outputs.version }}"
          # Set auth token for this command
          export NPM_TOKEN="${{ secrets.NPM_TOKEN }}"
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
          echo "registry=https://registry.npmjs.org/" >> ~/.npmrc
          
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            # Prerelease version - publish with beta tag
            pnpm publish --no-git-checks --tag beta
          else
            # Release version - publish with latest tag
            pnpm publish --no-git-checks --tag latest
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Git Tag
        if: steps.check-version.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.check-version.outputs.version }}"
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add package.json
          git commit -m "chore: bump version to $VERSION" || exit 0
          git tag "v$VERSION"
          git push origin "v$VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.check-version.outputs.exists == 'false' && github.event_name == 'push'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ steps.check-version.outputs.version }}
          body: |
            ## What's Changed

            - Updated TypeScript to 5.5.3
            - Updated Commander to 8.3.0
            - Updated JSON5 to 2.2.3
            - Updated ts-morph to 21.0.1
            - Added performance optimizations
            - Added scope option for monorepos
            - Added parallel processing option
            - Added performance metrics

            ## New Features

            - `--scope` - Limit analysis to specific directory (useful for monorepos)
            - `--parallel` - Enable parallel processing for better performance
            - `--performance` - Show performance metrics and timing information

            ## Performance Improvements

            - Automatic caching of analysis results
            - Parallel file processing
            - Optimized project loading for scope
            - Reduced memory usage in monorepos

            Full Changelog: https://github.com/nadeesha/ts-prune/compare/${{ github.event.before }}...${{ github.sha }}
          draft: false
          prerelease: false
